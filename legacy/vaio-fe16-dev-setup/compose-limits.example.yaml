# Exemplo local para desenvolvimento. Uso: sudo --preserve-env=POSTGRES_PASSWORD docker compose -f compose-limits.example.yaml up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_DB: dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD antes de iniciar}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d dev']
      interval: 10s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

volumes:
  postgres_data:
