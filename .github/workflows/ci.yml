name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/vaio-fe16-workstation

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bats shellcheck shfmt yamllint curl ca-certificates

      - name: Install pinned Gitleaks with SHA-256 verification
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          release_url="https://github.com/gitleaks/gitleaks/releases/download"
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            "$release_url/v${GITLEAKS_VERSION}/$archive_name" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file="$archive" \
            --directory="$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run documented host-independent verification
        run: |
          bash -n setup.sh lib/*.sh bin/* tests/integration/run-vm.sh
          shfmt -i 2 -d setup.sh
          shfmt -i 2 -d \
            lib/backup.sh lib/common.sh lib/gradle.sh \
            lib/memory.sh lib/mise.sh bin/dev-build bin/dev-doctor
          shfmt -i 4 -d \
            lib/profiles.sh lib/rollback.sh lib/virtualization.sh \
            bin/dev-emulator bin/dev-gate bin/dev-rollback bin/dev-run \
            tests/integration/run-vm.sh
          bash -n tests/integration/run-vm.sh
          shellcheck -x -S warning setup.sh \
            tests/integration/run-vm.sh
          yamllint examples/compose-limits.example.yaml
          yamllint -d relaxed .github/workflows/ci.yml
          bats tests/unit/*.bats
          python3 tests/unit/test_manifest.py
          sha256sum -c tests/fixtures/legacy.sha256
          gitleaks git --redact --no-banner --no-color .
